<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sysblock Copilot</title>
    <link rel="stylesheet" href="libs/github.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="libs/marked.min.js"></script>
    <script src="libs/highlight.min.js"></script>
    <script src="qwebchannel.js"></script>
</head>
<body>

    <div class="header">
        <div class="title-area">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
            <span class="app-title">Sysblock Copilot</span>
        </div>
        <button class="new-chat-btn" onclick="clearChat()">+ New Chat</button>
    </div>

    <div class="chat-container" id="chat-box">
        <div id="empty-state" class="empty-state"></div>
    </div>

    <div class="input-wrapper">
        <div class="input-card">
            <textarea id="inp" rows="1" placeholder="Ask a question to the AI Copilot" oninput="handleInput(this)" onkeydown="checkSend(event)"></textarea>

            <div class="footer-row">
                <div class="left-controls">
                    <div class="custom-select" id="mode-select">
                        <div class="select-trigger" onclick="toggleSelect('mode-select')">
                            <span class="trigger-text">Debug</span>
                            <svg class="chevron" width="10" height="10" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                        <ul class="select-options">
                            <li onclick="selectOption('mode-select', 'Ask', true)">Ask</li>
                            <li onclick="selectOption('mode-select', 'Agent')">Agent</li>
                            <li onclick="selectOption('mode-select', 'Debug')">Debug</li>
                        </ul>
                    </div>
                    <div class="custom-select" id="model-select">
                        <div class="select-trigger" onclick="toggleSelect('model-select')">
                            <span class="trigger-text">DeepSeek</span>
                            <svg class="chevron" width="10" height="10" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                        <ul class="select-options">
                            <li onclick="selectOption('model-select', 'gemini-3-pro', true)">gemini-3-pro</li>
                            <li onclick="selectOption('model-select', 'qwen-plus')">qwen-plus</li>
                            <li onclick="selectOption('model-select', 'qwen-coder-plus')">qwen-coder-plus</li>
                            <li onclick="selectOption('model-select', 'qwen-max')">qwen-max</li>
                            <li onclick="selectOption('model-select', 'deepseek-v3.2')">deepseek-v3.2</li>
                        </ul>
                    </div>
                    <div class="icon-btn tooltip" data-tip="Connection Settings" onclick="showSettings()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
                        </svg>
                    </div>
                </div>

                <div class="right-controls">
                    <div class="icon-btn tooltip" data-tip="Attach files" onclick="addFile()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                        </svg>
                        <span id="file-badge"></span>
                    </div>
                    
                    <div id="stop-btn" class="stop-btn tooltip" data-tip="Stop generating" onclick="stopGeneration()" style="display: none;">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/>
                            <rect x="9" y="9" width="6" height="6" rx="1" fill="currentColor" stroke="none"/>
                        </svg>
                    </div>

                    <div id="send-btn" class="send-btn tooltip" data-tip="Send" onclick="send()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
                    </svg>
                    Connection Settings
                </div>
                <div class="close-btn" onclick="hideSettings()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Model URL (Base URL)</label>
                <input type="text" id="api-url" class="form-input" placeholder="https://copilot-dev.tongyuan.cc/api/openai/v1" value="https://copilot-dev.tongyuan.cc/api/openai/v1">
            </div>

            <div class="form-group">
                <label class="form-label">API Key</label>
                <input type="password" id="api-key" class="form-input" placeholder="sk-...">
            </div>

            <div class="modal-footer">
                <button class="btn-cancel" onclick="hideSettings()">Cancel</button>
                <button class="btn-save" onclick="saveSettings()">Save</button>
            </div>
        </div>
    </div>
    
    <input type="file" id="file-input" style="display: none;">

    <script src="script.js"></script>
</body>
</html>
